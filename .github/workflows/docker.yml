name: Build and publish Docker image

on:
    push:
        tags:
            - 'v*'
            - '!*-rev.*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Tag to deploy (e.g. v1.2.3 or v1.2.3-dev.5)'
                required: true
                type: string
    workflow_call:
        inputs:
            version:
                required: true
                type: string

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_WEB: ghcr.io/tir-lavigny/register-web

jobs:
    docker:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.env.outputs.version }}
            is_dev: ${{ contains(steps.env.outputs.version, '-dev') && 'true' || 'false' }}

        concurrency:
            group: register-docker-${{ contains(inputs.version || github.ref_name, '-dev') && 'staging' || 'production' }}
            cancel-in-progress: false

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.version || github.ref }}

            - name: Determine environment
              id: env
              run: |
                  VERSION="${{ inputs.version || github.ref_name }}"
                  SHORT_SHA=$(git rev-parse --short=7 HEAD)
                  if [[ "$VERSION" == *"-dev"* ]]; then
                    {
                      echo "version=$VERSION"
                      echo "app_env=staging"
                      echo "api_url=${{ secrets.STAGING_VITE_API_BASE_URL }}"
                      echo "deploy_cmd=tir-lavigny-deploy-staging"
                      echo "sha_tag=${SHORT_SHA}-stg"
                    } >> "$GITHUB_OUTPUT"
                  else
                    {
                      echo "version=$VERSION"
                      echo "app_env=production"
                      echo "api_url=${{ secrets.VITE_API_BASE_URL }}"
                      echo "deploy_cmd=tir-lavigny-deploy-production"
                      echo "sha_tag=${SHORT_SHA}"
                    } >> "$GITHUB_OUTPUT"
                  fi

            - name: Log in to GHCR
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - name: Build and push image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: Dockerfile
                  target: production
                  push: true
                  build-args: |
                      VITE_APP_ENV=${{ steps.env.outputs.app_env }}
                      VITE_API_BASE_URL=${{ steps.env.outputs.api_url }}
                      VITE_BUILD_TAG=${{ steps.env.outputs.version }}
                  tags: |
                      ${{ env.IMAGE_WEB }}:${{ steps.env.outputs.version }}
                      ${{ env.IMAGE_WEB }}:${{ steps.env.outputs.sha_tag }}
                  cache-from: type=gha,scope=register-web-${{ steps.env.outputs.app_env }}
                  cache-to: type=gha,mode=max,scope=register-web-${{ steps.env.outputs.app_env }}

            - name: Scan image
              env:
                  VERSION: ${{ steps.env.outputs.version }}
              run: |
                  set -euo pipefail
                  TRIVY_VERSION="0.76.1"
                  TRIVY_SHA256="3350f4fac96ed099590c4a353bddb226f86311a0a2e7a8c626c162790d947f10"
                  curl -sSLo /tmp/trivy.deb "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
                  echo "${TRIVY_SHA256}  /tmp/trivy.deb" | sha256sum -c -
                  sudo apt-get install -y /tmp/trivy.deb >/dev/null

                  IMG="ghcr.io/tir-lavigny/register-web:${VERSION}"
                  {
                    echo "## Trivy scan: ${VERSION}"
                    echo "### ${IMG}"
                    trivy image --severity HIGH,CRITICAL --ignore-unfixed --quiet --format table "$IMG" || true
                  } >> "$GITHUB_STEP_SUMMARY"

                  n="$(trivy image --severity CRITICAL --ignore-unfixed --quiet --format json "$IMG" \
                      | jq '[.Results[]?.Vulnerabilities[]?] | length')"
                  if (( n > 0 )); then
                    echo "::error::${IMG}: ${n} fixable CRITICAL — deploy blocked"
                    exit 1
                  fi

    deploy-staging:
        needs: docker
        if: needs.docker.outputs.is_dev == 'true'
        runs-on: ubuntu-latest
        environment:
            name: staging
            url: https://staging.register.tir-lavigny.ch
        concurrency:
            group: register-staging-deploy
            cancel-in-progress: false

        steps:
            - name: Load SSH private key
              uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
              with:
                  ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
                  log-public-key: false

            - name: Add VPS to known_hosts
              run: ssh-keyscan -H ${{ secrets.VPS_SSH_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy to VPS (staging)
              run: |
                  ssh ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} \
                    "sudo /usr/local/sbin/tir-lavigny-deploy-staging ${{ needs.docker.outputs.version }} --register"

    dev-release:
        needs: docker
        if: needs.docker.outputs.is_dev == 'true'
        runs-on: ubuntu-latest

        steps:
            - name: Generate app token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              id: app-token
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Create dev release
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  gh release view "${{ needs.docker.outputs.version }}" >/dev/null 2>&1 || \
                  gh release create "${{ needs.docker.outputs.version }}" \
                    --title "${{ needs.docker.outputs.version }}" \
                    --prerelease \
                    --generate-notes
