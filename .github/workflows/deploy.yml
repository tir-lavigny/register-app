name: Deploy

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Tag to deploy (e.g. v1.2.3 or v1.2.3-dev.5)'
                required: true
                type: string

concurrency:
    group: register-deploy
    cancel-in-progress: false

jobs:
    deploy:
        name: Build & Deploy to server
        runs-on: ubuntu-latest
        environment:
            name: ${{ contains(github.event.inputs.version || github.ref_name, '-dev') && 'staging' || 'production' }}
            url: ${{ contains(github.event.inputs.version || github.ref_name, '-dev') && 'https://staging.register.tir-lavigny.ch' || 'https://register.tir-lavigny.ch' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.inputs.version || github.ref }}

            - name: Determine environment
              id: env
              run: |
                  TAG="${{ github.event.inputs.version || github.ref_name }}"
                  if [[ "$TAG" == *"-dev"* ]]; then
                    echo "api_url=${{ secrets.STAGING_VITE_API_BASE_URL }}" >> $GITHUB_OUTPUT
                    echo "target_path=${{ secrets.SSH_STAGING_TARGET_PATH }}" >> $GITHUB_OUTPUT
                    echo "app_env=staging" >> $GITHUB_OUTPUT
                  else
                    echo "api_url=${{ secrets.VITE_API_BASE_URL }}" >> $GITHUB_OUTPUT
                    echo "target_path=${{ secrets.SSH_TARGET_PATH }}" >> $GITHUB_OUTPUT
                    echo "app_env=production" >> $GITHUB_OUTPUT
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Setup .env file
              run: |
                  echo "VITE_API_BASE_URL=${{ steps.env.outputs.api_url }}" >> .env
                  echo "VITE_APP_ENV=${{ steps.env.outputs.app_env }}" >> .env

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Load SSH private key
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
                  log-public-key: false

            - name: Add server to known_hosts
              run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy dist/ via rsync
              run: |
                  rsync -avz --delete dist/ \
                    ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.env.outputs.target_path }}
